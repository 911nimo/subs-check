name: Sync from Upstream

on:
  workflow_dispatch:
  schedule:
    - cron: "0 9 * * *"

permissions:
  contents: write

concurrency:
  group: upstream-sync
  cancel-in-progress: true

jobs:
  sync:
    name: Sync upstream while preserving customizations
    runs-on: ubuntu-latest

    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git
        shell: bash
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"

      - name: Add upstream remote
        shell: bash
        run: |
          git remote remove upstream 2>/dev/null || true
          git remote add upstream https://github.com/beck-8/subs-check.git
          git fetch upstream master

      - name: Backup custom files
        shell: bash
        run: |
          mkdir -p /tmp/subs-custom-backup
          cp -f config/config.yaml /tmp/subs-custom-backup/config.yaml 2>/dev/null || true
          cp -f .github/workflows/main.yml /tmp/subs-custom-backup/main.yml 2>/dev/null || true
          cp -f .github/workflows/sync-upstream.yml /tmp/subs-custom-backup/sync-upstream.yml 2>/dev/null || true

      - name: Merge upstream
        shell: bash
        run: |
          git merge upstream/master -m "Sync upstream changes" || true

          git checkout --ours config/config.yaml 2>/dev/null || true
          git checkout --ours .github/workflows/main.yml 2>/dev/null || true
          git checkout --ours .github/workflows/sync-upstream.yml 2>/dev/null || true
          git checkout --ours output 2>/dev/null || true

          git add .
          git commit --no-edit || true

      - name: Restore custom files
        shell: bash
        run: |
          cp -f /tmp/subs-custom-backup/config.yaml config/config.yaml 2>/dev/null || true
          cp -f /tmp/subs-custom-backup/main.yml .github/workflows/main.yml 2>/dev/null || true
          cp -f /tmp/subs-custom-backup/sync-upstream.yml .github/workflows/sync-upstream.yml 2>/dev/null || true

          git add \
            config/config.yaml \
            .github/workflows/main.yml \
            .github/workflows/sync-upstream.yml

          git commit -m "Restore local workflow customizations" || true

      - name: Push
        shell: bash
        run: |
          git push origin HEAD:${GITHUB_REF_NAME}
