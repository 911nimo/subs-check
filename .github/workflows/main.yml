name: Update and Filter Subscriptions

permissions:
  contents: write

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  filter:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.21"

      - name: Create output directory
        run: mkdir -p ./output

      - name: Run subs-check
        run: |
          VERSION=$(git describe --tags --always 2>/dev/null || echo "dev")
          COMMIT=$(git rev-parse --short HEAD)

          echo "Version: $VERSION"
          echo "Commit:  $COMMIT"

          go run \
            -ldflags "-X main.Version=$VERSION -X main.CurrentCommit=$COMMIT" \
            main.go \
            -f config/config.yaml

      - name: Verify output
        run: |
          if [ ! -f "output/subscription.yaml" ]; then
            echo "❌ output/subscription.yaml was not generated."
            exit 1
          fi

          if [ ! -s "output/subscription.yaml" ]; then
            echo "❌ output/subscription.yaml is empty."
            exit 1
          fi

          echo "✅ Output generated successfully:"
          ls -lh output/subscription.yaml

          echo
          echo "Output preview:"
          head -30 output/subscription.yaml

      - name: Commit and push filtered output
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"

          git add output/subscription.yaml

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Auto-update filtered subscriptions [skip ci]"
            git push
          fi
