name: Update and Filter Subscriptions

permissions:
  contents: write

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

concurrency:
  group: subscription-update
  cancel-in-progress: true

jobs:
  filter:
    name: Build filtered subscriptions
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.21"
          cache: true

      - name: Verify configuration
        shell: bash
        run: |
          set -eu
          echo "========================================"
          echo "REPOSITORY"
          echo "========================================"
          echo "Commit:"
          git rev-parse --short HEAD
          echo
          echo "Branch:"
          git branch --show-current
          echo
          echo "========================================"
          echo "CONFIGURATION"
          echo "========================================"
          test -f ./config/config.yaml
          echo "Using:"
          ls -lh ./config/config.yaml
          echo
          echo "Subscription sources:"
          grep -nE '^[[:space:]]*-[[:space:]]*["'\'']?https?://' ./config/config.yaml || true
          echo
          echo "Important settings:"
          grep -nE '^(concurrent|media-concurrent|speed-concurrent|timeout|speed-test-url|min-speed|download-timeout|download-mb|total-speed-limit|media-check|output-dir|save-method|check-interval):' ./config/config.yaml || true

      - name: Build subs-check
        shell: bash
        run: |
          set -eu
          echo "========================================"
          echo "BUILDING SUBS-CHECK"
          echo "========================================"
          go build -o ./subs-check .
          test -x ./subs-check
          ls -lh ./subs-check

      - name: Prepare output directory
        shell: bash
        run: |
          set -eu
          mkdir -p ./output
          rm -f ./output/all.yaml ./output/subscription.yaml ./output/us.yaml ./output/world.yaml
          echo "========================================"
          echo "OUTPUT DIRECTORY"
          echo "========================================"
          ls -la ./output

      - name: Run subs-check and capture first completed result
        shell: bash
        run: |
          set -u
          echo "========================================"
          echo "STARTING SUBS-CHECK"
          echo "========================================"
          : > subs-check.log
          ./subs-check -f ./config/config.yaml > subs-check.log 2>&1 &
          PID=$!
          echo "subs-check PID: $PID"

          cleanup() {
            echo
            echo "========================================"
            echo "STOPPING SUBS-CHECK"
            echo "========================================"
            if kill -0 "$PID" 2>/dev/null; then
              kill "$PID" 2>/dev/null || true
              for i in 1 2 3 4 5; do
                if ! kill -0 "$PID" 2>/dev/null; then
                  break
                fi
                sleep 1
              done
              if kill -0 "$PID" 2>/dev/null; then
                kill -9 "$PID" 2>/dev/null || true
              fi
            fi
            wait "$PID" 2>/dev/null || true
          }
          trap cleanup EXIT

          MAX_WAIT=3600
          ELAPSED=0
          echo
          echo "Waiting for first completed output..."
          echo "Maximum wait: ${MAX_WAIT}s"

          while true; do
            if [ -s "./output/all.yaml" ]; then
              SIZE=$(wc -c < "./output/all.yaml")
              echo
              echo "========================================"
              echo "FIRST COMPLETE OUTPUT DETECTED"
              echo "========================================"
              echo "File: output/all.yaml"
              echo "Size: ${SIZE} bytes"
              break
            fi

            if ! kill -0 "$PID" 2>/dev/null; then
              echo
              echo "❌ subs-check exited before producing output."
              echo
              echo "========================================"
              echo "SUBS-CHECK LOG"
              echo "========================================"
              cat subs-check.log || true
              exit 1
            fi

            if [ "$ELAPSED" -ge "$MAX_WAIT" ]; then
              echo
              echo "❌ Timed out waiting for output."
              echo
              echo "========================================"
              echo "LAST LOG OUTPUT"
              echo "========================================"
              tail -200 subs-check.log || true
              exit 1
            fi

            if [ $((ELAPSED % 30)) -eq 0 ]; then
              echo
              echo "---- subs-check progress (${ELAPSED}s) ----"
              tail -15 subs-check.log || true
              echo "-------------------------------------------"
            fi

            sleep 10
            ELAPSED=$((ELAPSED + 10))
          done

          echo
          echo "✅ First test cycle completed successfully."

      - name: Show final subs-check result
        if: always()
        shell: bash
        run: |
          echo "========================================"
          echo "SUBS-CHECK FINAL LOG"
          echo "========================================"
          cat subs-check.log || true

      - name: Create subscription.yaml
        shell: bash
        run: |
          set -eu
          test -s ./output/all.yaml
          cp ./output/all.yaml ./output/subscription.yaml
          echo "========================================"
          echo "BASE OUTPUT"
          echo "========================================"
          ls -lh ./output/all.yaml ./output/subscription.yaml

      - name: Split US and World subscriptions
        shell: bash
        run: |
          set -eu
          echo "========================================"
          echo "SPLITTING US / WORLD OUTPUT"
          echo "========================================"
          test -s ./output/all.yaml

          python3 <<'PY'
          from pathlib import Path
          import re

          src = Path("output/all.yaml")
          us_file = Path("output/us.yaml")
          world_file = Path("output/world.yaml")

          text = src.read_text(encoding="utf-8")
          lines = text.splitlines(keepends=True)

          # Identify the proxies section.
          proxies_start = None
          proxies_end = len(lines)

          for i, line in enumerate(lines):
              if re.match(r"^proxies:\s*$", line):
                  proxies_start = i
                  break

          if proxies_start is None:
              raise SystemExit("ERROR: Could not find 'proxies:' section.")

          # Find the end of the proxies list.
          for i in range(proxies_start + 1, len(lines)):
              line = lines[i]
              if line and not line.startswith((" ", "\t", "-", "#")):
                  if re.match(r"^[A-Za-z0-9_-]+:\s*", line):
                      proxies_end = i
                      break

          header = lines[:proxies_start + 1]
          proxy_lines = lines[proxies_start + 1:proxies_end]
          footer = lines[proxies_end:]

          # Parse individual proxy blocks.
          blocks = []
          current = []

          for line in proxy_lines:
              if re.match(r"^\s*-\s+name\s*:", line):
                  if current:
                      blocks.append(current)
                  current = [line]
              elif current:
                  current.append(line)

          if current:
              blocks.append(current)

          us_emoji = "\U0001F1FA\U0001F1F8"  # 🇺🇸

          us_blocks = []
          world_blocks = []

          for block in blocks:
              name = ""
              if block:
                  match = re.match(r"^\s*-\s+name\s*:\s*(.*?)(?:\r?\n)?$", block[0])
                  if match:
                      name = match.group(1).strip()

                      # Strip surrounding quotes if present
                      if (name.startswith('"') and name.endswith('"')) or \
                         (name.startswith("'") and name.endswith("'")):
                          name = name[1:-1]

              if name.startswith(us_emoji) or re.match(r"^US_", name):
                  us_blocks.append(block)
              else:
                  world_blocks.append(block)

          def write_file(path, blocks):
              output = []
              output.extend(header)
              for block in blocks:
                  output.extend(block)
              output.extend(footer)
              path.write_text("".join(output), encoding="utf-8")

          write_file(us_file, us_blocks)
          write_file(world_file, world_blocks)

          print("========================================")
          print("SPLIT COMPLETE")
          print("========================================")
          print(f"Total proxy entries: {len(blocks)}")
          print(f"US proxy entries:    {len(us_blocks)}")
          print(f"World proxy entries: {len(world_blocks)}")
          if len(us_blocks) + len(world_blocks) != len(blocks):
              raise SystemExit("ERROR: US + World count does not equal total count.")
          PY

          echo
          echo "Generated files:"
          ls -lh ./output/all.yaml ./output/subscription.yaml ./output/us.yaml ./output/world.yaml

      - name: Validate generated subscriptions
        shell: bash
        run: |
          set -eu
          echo "========================================"
          echo "OUTPUT VALIDATION"
          echo "========================================"
          for FILE in ./output/all.yaml ./output/subscription.yaml ./output/us.yaml ./output/world.yaml; do
            if [ ! -s "$FILE" ]; then
              echo "❌ Missing or empty: $FILE"
              exit 1
            fi
            echo
            echo "File: $FILE"
            ls -lh "$FILE"
            COUNT=$(grep -cE '^[[:space:]]*-[[:space:]]*name:' "$FILE" || true)
            echo "Proxy entries: $COUNT"
          done
          echo
          echo "========================================"
          echo "FILE SIZES"
          echo "========================================"
          wc -c ./output/all.yaml ./output/subscription.yaml ./output/us.yaml ./output/world.yaml

      - name: Verify split counts
        shell: bash
        run: |
          set -eu
          ALL_COUNT=$(grep -cE '^[[:space:]]*-[[:space:]]*name:' ./output/all.yaml || true)
          US_COUNT=$(grep -cE '^[[:space:]]*-[[:space:]]*name:' ./output/us.yaml || true)
          WORLD_COUNT=$(grep -cE '^[[:space:]]*-[[:space:]]*name:' ./output/world.yaml || true)
          echo "========================================"
          echo "SPLIT COUNT CHECK"
          echo "========================================"
          echo "All:   $ALL_COUNT"
          echo "US:    $US_COUNT"
          echo "World: $WORLD_COUNT"
          echo
          echo "US + World: $((US_COUNT + WORLD_COUNT))"
          if [ "$((US_COUNT + WORLD_COUNT))" -ne "$ALL_COUNT" ]; then
            echo "❌ SPLIT COUNT MISMATCH"
            exit 1
          fi
          echo "✅ Split count verified."

      - name: Upload generated subscriptions
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: filtered-subscriptions
          path: |
            output/all.yaml
            output/subscription.yaml
            output/us.yaml
            output/world.yaml
            subs-check.log
          if-no-files-found: warn
          retention-days: 7

      - name: Commit and push output
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "COMMITTING OUTPUT"
          echo "========================================"

          for FILE in output/all.yaml output/subscription.yaml output/us.yaml output/world.yaml; do
            if [ ! -s "$FILE" ]; then
              echo "❌ Missing or empty: $FILE"
              exit 1
            fi
          done

          echo "Generated files:"
          ls -lh output/all.yaml output/subscription.yaml output/us.yaml output/world.yaml

          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"

          git add -f output/all.yaml
          git add -f output/subscription.yaml
          git add -f output/us.yaml
          git add -f output/world.yaml

          if git diff --cached --quiet; then
            echo
            echo "ℹ️ No output changes to commit."
            exit 0
          fi

          echo
          echo "Changes to commit:"
          git diff --cached --stat

          git commit -m "Auto-update filtered subscriptions"

          # Pull latest remote changes to avoid push rejection
          echo
          echo "Pulling latest remote changes..."
          git pull --rebase origin ${GITHUB_REF_NAME} || {
            echo "⚠️ Rebase failed. Trying to merge with strategy 'ours'."
            git pull origin ${GITHUB_REF_NAME} --no-rebase --strategy-option=ours
          }

          git push origin HEAD:${GITHUB_REF_NAME}

          echo
          echo "✅ Push completed."