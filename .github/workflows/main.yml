name: Update and Filter Subscriptions

permissions:
  contents: write

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  filter:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.21"

      - name: Show repository and configuration
        run: |
          echo "========================================"
          echo "REPOSITORY"
          echo "========================================"
          pwd
          git rev-parse --show-toplevel
          git rev-parse --short HEAD

          echo
          echo "========================================"
          echo "CONFIG FILE"
          echo "========================================"
          ls -lah ./config/config.yaml
          echo
          sed -n '1,220p' ./config/config.yaml

      - name: Create output directory
        run: |
          mkdir -p ./output
          rm -f ./output/*.yaml

      - name: Run subs-check
        run: |
          VERSION=$(git describe --tags --always 2>/dev/null || echo "dev")
          COMMIT=$(git rev-parse --short HEAD)

          echo "========================================"
          echo "RUNNING SUBS-CHECK"
          echo "========================================"
          echo "Version: $VERSION"
          echo "Commit:  $COMMIT"
          echo

          go run . \
            -ldflags "-X main.Version=$VERSION -X main.CurrentCommit=$COMMIT" \
            -f ./config/config.yaml

      - name: Inspect generated output
        run: |
          echo "========================================"
          echo "OUTPUT DIRECTORY"
          echo "========================================"

          if [ ! -d "./output" ]; then
            echo "❌ output directory does not exist"
            exit 1
          fi

          find ./output -maxdepth 2 -type f -printf '%p (%s bytes)\n' | sort

          echo
          echo "========================================"
          echo "YAML FILES"
          echo "========================================"

          find ./output -type f \
            \( -name "*.yaml" -o -name "*.yml" \) \
            -print

      - name: Verify nodes were produced
        run: |
          echo "========================================"
          echo "VERIFYING RESULT"
          echo "========================================"

          if ! find ./output -type f \
              \( -name "*.yaml" -o -name "*.yml" \) \
              | grep -q .; then
            echo "❌ No YAML output was generated."
            exit 1
          fi

          echo "✅ YAML output exists."

      - name: Commit and push filtered output
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"

          git add output/

          if git diff --cached --quiet; then
            echo "No output changes to commit."
          else
            git commit -m "Auto-update filtered subscriptions [skip ci]"
            git push
          fi
