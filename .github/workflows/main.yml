name: Update and Filter Subscriptions

# ✅ This is the fix – grant write permission to the token
permissions:
  contents: write

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  filter:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.21"

      - name: Create output directory
        run: mkdir -p ./output

      - name: Run subs-check (with failure safeguard)
        id: subscheck
        continue-on-error: true
        run: |
          go run ./cmd/subs-check -c config/config.yaml

      - name: Check if output was generated
        run: |
          if [ ! -f "output/subscription.yaml" ]; then
            echo "⚠️ subs-check failed. Creating placeholder."
            echo "proxies: []" > output/subscription.yaml
          else
            echo "✅ Output generated."
          fi

      - name: Commit and push filtered output
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add output/
          git commit -m "Auto-update filtered subscriptions [skip ci]" || echo "No changes to commit"
          git push
