name: Update and Filter Subscriptions

permissions:
  contents: write

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

concurrency:
  group: subscription-update
  cancel-in-progress: true

jobs:
  filter:
    name: Build filtered subscriptions
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      # ============================================================
      # CHECKOUT
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ============================================================
      # GO
      # ============================================================
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.21"
          cache: true

      # ============================================================
      # VERIFY CONFIGURATION
      # ============================================================
      - name: Verify configuration
        shell: bash
        run: |
          set -eu

          echo "========================================"
          echo "REPOSITORY"
          echo "========================================"
          echo "Commit:"
          git rev-parse --short HEAD
          echo
          echo "Branch:"
          git branch --show-current
          echo

          echo "========================================"
          echo "CONFIGURATION"
          echo "========================================"

          test -f ./config/config.yaml

          echo "Using:"
          ls -lh ./config/config.yaml
          echo

          echo "Subscription sources:"
          grep -nE '^[[:space:]]*-[[:space:]]*["'\'']?https?://' \
            ./config/config.yaml || true

          echo

          echo "Important settings:"
          grep -nE '^(concurrent|media-concurrent|speed-concurrent|timeout|speed-test-url|min-speed|download-timeout|download-mb|total-speed-limit|media-check|output-dir|save-method|check-interval):' \
            ./config/config.yaml || true

      # ============================================================
      # BUILD
      # ============================================================
      - name: Build subs-check
        shell: bash
        run: |
          set -eu

          echo "========================================"
          echo "BUILDING SUBS-CHECK"
          echo "========================================"

          go build -o ./subs-check .

          test -x ./subs-check

          ls -lh ./subs-check

      # ============================================================
      # PREPARE OUTPUT
      # ============================================================
      - name: Prepare output directory
        shell: bash
        run: |
          set -eu

          mkdir -p ./output

          rm -f \
            ./output/all.yaml \
            ./output/subscription.yaml \
            ./output/us.yaml \
            ./output/world.yaml

          echo "========================================"
          echo "OUTPUT DIRECTORY"
          echo "========================================"

          ls -la ./output

      # ============================================================
      # RUN SUBS-CHECK
      # ============================================================
      - name: Run subs-check and capture first completed result
        shell: bash
        run: |
          set -u

          echo "========================================"
          echo "STARTING SUBS-CHECK"
          echo "========================================"

          : > subs-check.log

          ./subs-check -f ./config/config.yaml > subs-check.log 2>&1 &

          PID=$!

          echo "subs-check PID: $PID"

          cleanup() {
            echo
            echo "========================================"
            echo "STOPPING SUBS-CHECK"
            echo "========================================"

            if kill -0 "$PID" 2>/dev/null; then
              kill "$PID" 2>/dev/null || true

              for i in 1 2 3 4 5; do
                if ! kill -0 "$PID" 2>/dev/null; then
                  break
                fi
                sleep 1
              done

              if kill -0 "$PID" 2>/dev/null; then
                kill -9 "$PID" 2>/dev/null || true
              fi
            fi

            wait "$PID" 2>/dev/null || true
          }

          trap cleanup EXIT

          MAX_WAIT=3600
          ELAPSED=0

          echo
          echo "Waiting for first completed output..."
          echo "Maximum wait: ${MAX_WAIT}s"

          while true; do

            if [ -s "./output/all.yaml" ]; then

              SIZE=$(wc -c < "./output/all.yaml")

              echo
              echo "========================================"
              echo "FIRST COMPLETE OUTPUT DETECTED"
              echo "========================================"

              echo "File: output/all.yaml"
              echo "Size: ${SIZE} bytes"

              break
            fi

            if ! kill -0 "$PID" 2>/dev/null; then

              echo
              echo "❌ subs-check exited before producing output."
              echo
              echo "========================================"
              echo "SUBS-CHECK LOG"
              echo "========================================"

              cat subs-check.log || true

              exit 1
            fi

            if [ "$ELAPSED" -ge "$MAX_WAIT" ]; then

              echo
              echo "❌ Timed out waiting for output."
              echo
              echo "========================================"
              echo "LAST LOG OUTPUT"
              echo "========================================"

              tail -200 subs-check.log || true

              exit 1
            fi

            if [ $((ELAPSED % 30)) -eq 0 ]; then

              echo
              echo "---- subs-check progress (${ELAPSED}s) ----"

              tail -15 subs-check.log || true

              echo "-------------------------------------------"
            fi

            sleep 10

            ELAPSED=$((ELAPSED + 10))
          done

          echo
          echo "✅ First test cycle completed successfully."

      # ============================================================
      # SHOW LOG
      # ============================================================
      - name: Show final subs-check result
        if: always()
        shell: bash
        run: |
          echo "========================================"
          echo "SUBS-CHECK FINAL LOG"
          echo "========================================"

          cat subs-check.log || true

      # ============================================================
      # CREATE EXACT COPY
      # ============================================================
      - name: Create subscription.yaml
        shell: bash
        run: |
          set -eu

          test -s ./output/all.yaml

          cp ./output/all.yaml ./output/subscription.yaml

          echo "========================================"
          echo "BASE OUTPUT"
          echo "========================================"

          ls -lh \
            ./output/all.yaml \
            ./output/subscription.yaml

          echo
          echo "Verifying byte-for-byte identity..."

          cmp -s \
            ./output/all.yaml \
            ./output/subscription.yaml

          echo "✅ subscription.yaml is byte-for-byte identical to all.yaml."

      # ============================================================
      # INSTALL PYTHON DEPENDENCIES
      # ============================================================
      - name: Install GeoIP dependencies
        shell: bash
        run: |
          set -eu

          python3 -m pip install --upgrade pip

          python3 -m pip install \
            pyyaml \
            geoip2

      # ============================================================
      # DOWNLOAD DB-IP COUNTRY DATABASE
      # ============================================================
      - name: Download GeoIP country database
        shell: bash
        run: |
          set -eu

          mkdir -p ./geoip

          YEAR=$(date -u +%Y)
          MONTH=$(date -u +%m)

          CURRENT_URL="https://download.db-ip.com/free/dbip-country-lite-${YEAR}-${MONTH}.mmdb.gz"

          PREV_MONTH=$(date -u -d "${YEAR}-${MONTH}-01 -1 month" +%m)
          PREV_YEAR=$(date -u -d "${YEAR}-${MONTH}-01 -1 month" +%Y)

          PREVIOUS_URL="https://download.db-ip.com/free/dbip-country-lite-${PREV_YEAR}-${PREV_MONTH}.mmdb.gz"

          echo "========================================"
          echo "DB-IP COUNTRY DATABASE"
          echo "========================================"

          echo "Trying current database:"
          echo "$CURRENT_URL"

          if curl -fL \
            --retry 3 \
            --retry-delay 2 \
            --connect-timeout 20 \
            --max-time 120 \
            "$CURRENT_URL" \
            -o ./geoip/dbip.mmdb.gz; then

            echo "✅ Current month database downloaded."

          else

            echo
            echo "Current month database unavailable."
            echo "Trying previous month:"

            echo "$PREVIOUS_URL"

            curl -fL \
              --retry 3 \
              --retry-delay 2 \
              --connect-timeout 20 \
              --max-time 120 \
              "$PREVIOUS_URL" \
              -o ./geoip/dbip.mmdb.gz

            echo "✅ Previous month database downloaded."
          fi

          gzip -df ./geoip/dbip.mmdb.gz

          test -s ./geoip/dbip.mmdb

          ls -lh ./geoip/dbip.mmdb

          echo
          echo "GeoIP source: DB-IP Lite"
          echo "https://db-ip.com"

      # ============================================================
      # GEOIP COUNTRY CORRECTION + SPLIT
      # ============================================================
      - name: GeoIP country correction
        shell: bash
        run: |
          set -eu

          python3 <<'PY'
          import copy
          import ipaddress
          import json
          import re
          import socket
          from collections import Counter
          from concurrent.futures import ThreadPoolExecutor, as_completed

          import geoip2.database
          import yaml


          ALL_FILE = "./output/all.yaml"
          US_FILE = "./output/us.yaml"
          WORLD_FILE = "./output/world.yaml"
          GEOIP_DB = "./geoip/dbip.mmdb"


          # ------------------------------------------------------------
          # COUNTRY DEFINITIONS
          # ------------------------------------------------------------

          COUNTRY_CODES = {
              "US", "CA", "MX", "GB", "IE", "FR", "DE", "NL", "BE",
              "LU", "CH", "AT", "IT", "ES", "PT", "SE", "NO", "DK",
              "FI", "IS", "PL", "CZ", "SK", "HU", "RO", "BG", "GR",
              "HR", "SI", "RS", "UA", "TR", "RU", "EE", "LV", "LT",
              "AL", "BA", "ME", "MK", "MD", "BY", "GE", "AM", "AZ",
              "IL", "AE", "SA", "QA", "BH", "KW", "OM", "JO", "EG",
              "ZA", "NG", "KE", "IN", "PK", "BD", "LK", "NP", "CN",
              "HK", "MO", "TW", "JP", "KR", "SG", "MY", "TH", "VN",
              "ID", "PH", "AU", "NZ", "BR", "AR", "CL", "PE", "CO",
              "VE", "UY", "PY", "BO", "EC", "CR", "PA", "GT", "DO",
              "CU", "PR", "BM", "KY", "VG", "VI", "IR", "IQ", "KZ",
              "UZ", "KG", "TJ", "TM", "MN", "KH", "LA", "MM"
          }


          def country_flag(code):
              """
              Convert ISO alpha-2 country code to regional-indicator flag.
              """
              if not code or len(code) != 2:
                  return "🌍"

              code = code.upper()

              if not code.isalpha():
                  return "🌍"

              return "".join(
                  chr(0x1F1E6 + ord(c) - ord("A"))
                  for c in code
              )


          def normalize_country(code):
              if not code:
                  return None

              code = str(code).upper().strip()

              if code in COUNTRY_CODES:
                  return code

              return None


          # ------------------------------------------------------------
          # NAME PREFIX PARSING
          # ------------------------------------------------------------

          # Recognized forms include:
          #
          #   🇺🇸US_1
          #   US_1
          #   🇩🇪DE_Foo
          #   DE_Foo
          #
          # The remainder is NEVER modified.
          #

          FLAG_PREFIX_RE = re.compile(
              r"^(?P<flag>[\U0001F1E6-\U0001F1FF]{2})(?P<code>[A-Za-z]{2})_(?P<rest>.*)$"
          )

          CODE_PREFIX_RE = re.compile(
              r"^(?P<code>[A-Za-z]{2})_(?P<rest>.*)$"
          )


          def split_existing_prefix(name):
              """
              Return (country_code, remainder) if a recognized prefix exists.

              Otherwise return (None, name).

              Only the prefix is considered mutable.
              """

              if not isinstance(name, str):
                  name = "" if name is None else str(name)

              m = FLAG_PREFIX_RE.match(name)

              if m:
                  code = normalize_country(m.group("code"))

                  if code:
                      return code, m.group("rest")

              m = CODE_PREFIX_RE.match(name)

              if m:
                  code = normalize_country(m.group("code"))

                  if code:
                      return code, m.group("rest")

              return None, name


          def make_name(name, detected_country):
              """
              Correct only the country prefix.

              Examples:

                🇺🇸US_1
                  -> 🇫🇷FR_1

                US_1
                  -> 🇫🇷FR_1

                Foo
                  -> 🇫🇷FR_Foo

                Foo with ambiguous GeoIP
                  -> 🌍WW_Foo
              """

              if not isinstance(name, str):
                  name = "" if name is None else str(name)

              old_country, remainder = split_existing_prefix(name)

              if detected_country == "WW":
                  prefix = "🌍WW_"

              else:
                  prefix = country_flag(detected_country) + detected_country + "_"

              return prefix + remainder


          # ------------------------------------------------------------
          # DNS RESOLUTION
          # ------------------------------------------------------------

          def extract_server(proxy):
              if not isinstance(proxy, dict):
                  return None

              server = proxy.get("server")

              if server is None:
                  return None

              server = str(server).strip()

              if not server:
                  return None

              return server


          def resolve_server(server):
              """
              Resolve a hostname once.

              IP literals are returned directly.

              Hostnames are resolved for both IPv4 and IPv6.

              Every unique address is retained so that we can detect
              country ambiguity rather than arbitrarily choosing one.
              """

              try:
                  ip = ipaddress.ip_address(server)

                  return {
                      "server": server,
                      "ips": [str(ip)],
                      "error": None,
                  }

              except ValueError:
                  pass

              addresses = set()

              try:
                  infos = socket.getaddrinfo(
                      server,
                      None,
                      socket.AF_UNSPEC,
                      socket.SOCK_STREAM,
                  )

                  for info in infos:
                      sockaddr = info[4]

                      if not sockaddr:
                          continue

                      address = sockaddr[0]

                      try:
                          ipaddress.ip_address(address)
                          addresses.add(address)
                      except ValueError:
                          continue

              except Exception as exc:
                  return {
                      "server": server,
                      "ips": [],
                      "error": str(exc),
                  }

              if not addresses:
                  return {
                      "server": server,
                      "ips": [],
                      "error": "no-addresses",
                  }

              # Deterministic ordering.
              ordered = sorted(
                  addresses,
                  key=lambda x: (
                      0 if ipaddress.ip_address(x).version == 4 else 1,
                      x,
                  ),
              )

              return {
                  "server": server,
                  "ips": ordered,
                  "error": None,
              }


          # ------------------------------------------------------------
          # GEOIP LOOKUP
          # ------------------------------------------------------------

          def lookup_country(reader, ip):
              try:
                  response = reader.country(ip)

                  code = normalize_country(
                      response.country.iso_code
                  )

                  if not code:
                      return None

                  return code

              except Exception:
                  return None


          # ------------------------------------------------------------
          # LOAD ALL.YAML
          # ------------------------------------------------------------

          print("========================================")
          print("GEOIP COUNTRY CORRECTION")
          print("========================================")

          with open(
              ALL_FILE,
              "r",
              encoding="utf-8",
          ) as f:
              root = yaml.safe_load(f)


          if not isinstance(root, dict):
              raise RuntimeError(
                  "all.yaml root is not a YAML mapping"
              )


          proxies = root.get("proxies")

          if not isinstance(proxies, list):
              raise RuntimeError(
                  "all.yaml does not contain a 'proxies' list"
              )


          print(f"Input proxies: {len(proxies)}")


          # ------------------------------------------------------------
          # EXTRACT UNIQUE SERVERS
          # ------------------------------------------------------------

          servers = sorted(
              {
                  server
                  for proxy in proxies
                  if (server := extract_server(proxy)) is not None
              }
          )


          print(f"Unique servers: {len(servers)}")


          # ------------------------------------------------------------
          # CONCURRENT DNS RESOLUTION
          # ------------------------------------------------------------

          print()
          print("Resolving unique servers...")

          dns_results = {}

          DNS_WORKERS = 50

          with ThreadPoolExecutor(
              max_workers=DNS_WORKERS
          ) as executor:

              future_map = {
                  executor.submit(
                      resolve_server,
                      server
                  ): server
                  for server in servers
              }

              completed = 0

              for future in as_completed(future_map):

                  server = future_map[future]

                  try:
                      result = future.result()
                  except Exception as exc:
                      result = {
                          "server": server,
                          "ips": [],
                          "error": str(exc),
                      }

                  dns_results[server] = result

                  completed += 1

                  if (
                      completed % 500 == 0
                      or completed == len(servers)
                  ):
                      print(
                          f"DNS resolved "
                          f"{completed}/{len(servers)}"
                      )


          dns_failed_servers = sum(
              1
              for result in dns_results.values()
              if not result["ips"]
          )


          print(
              f"DNS-failed unique servers: "
              f"{dns_failed_servers}"
          )


          # ------------------------------------------------------------
          # OPEN GEOIP DATABASE
          # ------------------------------------------------------------

          reader = geoip2.database.Reader(GEOIP_DB)


          # ------------------------------------------------------------
          # CACHE GEOIP BY IP
          # ------------------------------------------------------------

          unique_ips = sorted(
              {
                  ip
                  for result in dns_results.values()
                  for ip in result["ips"]
              }
          )


          print(
              f"Unique IP addresses for GeoIP: "
              f"{len(unique_ips)}"
          )


          ip_country = {}

          for ip in unique_ips:
              ip_country[ip] = lookup_country(
                  reader,
                  ip,
              )


          reader.close()


          # ------------------------------------------------------------
          # DETERMINE COUNTRY FOR EACH SERVER
          # ------------------------------------------------------------

          server_country = {}

          server_status = {}

          for server in servers:

              result = dns_results[server]

              ips = result["ips"]

              if not ips:
                  server_country[server] = None
                  server_status[server] = "DNS_FAILED"
                  continue

              countries = {
                  ip_country.get(ip)
                  for ip in ips
              }

              countries.discard(None)

              if not countries:
                  server_country[server] = None
                  server_status[server] = "GEOIP_FAILED"

              elif len(countries) > 1:
                  # IMPORTANT:
                  #
                  # Multiple countries means the hostname is ambiguous.
                  # Do NOT guess.
                  #
                  # It becomes WW / World.
                  server_country[server] = "WW"
                  server_status[server] = "AMBIGUOUS"

              else:
                  server_country[server] = next(
                      iter(countries)
                  )
                  server_status[server] = "OK"


          # ------------------------------------------------------------
          # PROCESS PROXIES
          # ------------------------------------------------------------

          us_proxies = []
          world_proxies = []

          corrected = 0
          dns_failed = 0
          geoip_failed = 0
          ambiguous = 0

          original_proxies = copy.deepcopy(proxies)

          examples = []

          total = len(proxies)

          for index, proxy in enumerate(proxies, start=1):

              if not isinstance(proxy, dict):
                  # Preserve malformed/non-mapping proxy entries.
                  #
                  # They cannot be GeoIP classified, therefore World.
                  world_proxies.append(copy.deepcopy(proxy))
                  continue


              output_proxy = copy.deepcopy(proxy)

              server = extract_server(proxy)

              original_name = proxy.get("name")

              country = None
              status = "GEOIP_FAILED"

              if server is not None:

                  country = server_country.get(server)

                  status = server_status.get(
                      server,
                      "GEOIP_FAILED",
                  )


              # --------------------------------------------------------
              # COUNTRY / NAME DECISION
              # --------------------------------------------------------

              if country == "WW":

                  # Explicit ambiguity:
                  # 🌍WW_
                  output_proxy["name"] = make_name(
                      original_name,
                      "WW",
                  )

                  ambiguous += 1

                  # World.
                  world_proxies.append(output_proxy)

                  if len(examples) < 20:
                      examples.append(
                          (
                              "AMBIGUOUS",
                              server,
                              original_name,
                              output_proxy.get("name"),
                          )
                      )


              elif country:

                  new_name = make_name(
                      original_name,
                      country,
                  )

                  output_proxy["name"] = new_name

                  if new_name != original_name:
                      corrected += 1

                      if len(examples) < 20:
                          examples.append(
                              (
                                  "CORRECTED",
                                  server,
                                  original_name,
                                  new_name,
                              )
                          )

                  if country == "US":
                      us_proxies.append(output_proxy)
                  else:
                      world_proxies.append(output_proxy)


              else:

                  # DNS or GeoIP failure:
                  #
                  # Do NOT invent a country.
                  # Preserve original name exactly.
                  #
                  output_proxy["name"] = original_name

                  if status == "DNS_FAILED":
                      dns_failed += 1
                  else:
                      geoip_failed += 1

                  world_proxies.append(output_proxy)


              if (
                  index % 500 == 0
                  or index == total
              ):

                  print(
                      f"Processed {index}/{total} "
                      f"| US={len(us_proxies)} "
                      f"| World={len(world_proxies)} "
                      f"| corrected={corrected} "
                      f"| ambiguous={ambiguous} "
                      f"| DNS-failed={dns_failed} "
                      f"| GeoIP-failed={geoip_failed}"
                  )


          # ------------------------------------------------------------
          # SAVE SPLIT FILES
          # ------------------------------------------------------------

          us_root = copy.deepcopy(root)
          world_root = copy.deepcopy(root)

          us_root["proxies"] = us_proxies
          world_root["proxies"] = world_proxies


          with open(
              US_FILE,
              "w",
              encoding="utf-8",
              newline="\n",
          ) as f:
              yaml.safe_dump(
                  us_root,
                  f,
                  allow_unicode=True,
                  sort_keys=False,
                  default_flow_style=False,
              )


          with open(
              WORLD_FILE,
              "w",
              encoding="utf-8",
              newline="\n",
          ) as f:
              yaml.safe_dump(
                  world_root,
                  f,
                  allow_unicode=True,
                  sort_keys=False,
                  default_flow_style=False,
              )


          # ------------------------------------------------------------
          # VALIDATION
          # ------------------------------------------------------------

          def canonical_proxy(proxy):
              """
              Canonical representation for validation.

              IMPORTANT:
              'name' is deliberately excluded because GeoIP correction
              is allowed to modify ONLY the name.

              Every other proxy property must remain identical.
              """

              if isinstance(proxy, dict):

                  proxy = copy.deepcopy(proxy)

                  proxy.pop("name", None)

              return json.dumps(
                  proxy,
                  sort_keys=True,
                  ensure_ascii=False,
                  separators=(",", ":"),
              )


          original_counter = Counter(
              canonical_proxy(proxy)
              for proxy in original_proxies
          )


          combined_counter = Counter(
              canonical_proxy(proxy)
              for proxy in (
                  us_proxies +
                  world_proxies
              )
          )


          missing_counter = (
              original_counter -
              combined_counter
          )

          extra_counter = (
              combined_counter -
              original_counter
          )


          missing_count = sum(
              missing_counter.values()
          )

          extra_count = sum(
              extra_counter.values()
          )


          print()
          print("========================================")
          print("VALIDATION")
          print("========================================")

          print(
              f"Original proxies: {len(original_proxies)}"
          )

          print(
              f"Output proxies:   "
              f"{len(us_proxies) + len(world_proxies)}"
          )

          print(
              f"Missing proxies:  {missing_count}"
          )

          print(
              f"Extra proxies:    {extra_count}"
          )


          if missing_count or extra_count:

              print()
              print(
                  "❌ VALIDATION FAILED: "
                  "US + World does not exactly reconstruct "
                  "all.yaml when comparing proxy configuration "
                  "excluding name."
              )

              print()
              print("Missing examples:")

              for item, count in missing_counter.most_common(10):
                  print(
                      f"  count={count} {item}"
                  )


              print()
              print("Extra examples:")

              for item, count in extra_counter.most_common(10):
                  print(
                      f"  count={count} {item}"
                  )

              raise RuntimeError(
                  "VALIDATION FAILED: "
                  "US + World does not exactly reconstruct "
                  "all.yaml"
              )


          # ------------------------------------------------------------
          # VALIDATE TOTAL COUNT
          # ------------------------------------------------------------

          if (
              len(us_proxies) +
              len(world_proxies)
          ) != len(original_proxies):

              raise RuntimeError(
                  "VALIDATION FAILED: proxy count changed"
              )


          # ------------------------------------------------------------
          # VALIDATE US CLASSIFICATION
          # ------------------------------------------------------------

          us_names = [
              proxy.get("name")
              for proxy in us_proxies
              if isinstance(proxy, dict)
          ]

          for name in us_names:

              if not isinstance(name, str):
                  raise RuntimeError(
                      "VALIDATION FAILED: US proxy has no name"
                  )

              if not (
                  name.startswith("🇺🇸US_")
              ):
                  raise RuntimeError(
                      "VALIDATION FAILED: "
                      f"US proxy does not have 🇺🇸US_ prefix: {name}"
                  )


          # ------------------------------------------------------------
          # VALIDATE WORLD AMBIGUITY PREFIX
          # ------------------------------------------------------------

          for proxy in world_proxies:

              if not isinstance(proxy, dict):
                  continue

              name = proxy.get("name")

              if isinstance(name, str):

                  if name.startswith("🌍WW_"):
                      continue

                  # Other country prefixes are valid World nodes.
                  # Nodes with failed GeoIP retain their original name.


          # ------------------------------------------------------------
          # PRINT EXAMPLES
          # ------------------------------------------------------------

          print()
          print("========================================")
          print("COUNTRY CORRECTION SUMMARY")
          print("========================================")

          print(f"US proxies:       {len(us_proxies)}")
          print(f"World proxies:    {len(world_proxies)}")
          print(f"Corrected names:  {corrected}")
          print(f"Ambiguous:        {ambiguous}")
          print(f"DNS failed:       {dns_failed}")
          print(f"GeoIP failed:     {geoip_failed}")


          if examples:

              print()
              print("Examples:")

              for (
                  status,
                  server,
                  old_name,
                  new_name,
              ) in examples:

                  print()
                  print(f"[{status}]")
                  print(f"Server: {server}")
                  print(f"Old:    {old_name}")
                  print(f"New:    {new_name}")


          print()
          print("========================================")
          print("GEOIP COUNTRY CORRECTION COMPLETE")
          print("========================================")

          print(
              "✅ US + World exactly reconstruct all.yaml "
              "when proxy names are ignored."
          )
          PY

      # ============================================================
      # FINAL OUTPUT VALIDATION
      # ============================================================
      - name: Validate final output files
        shell: bash
        run: |
          set -eu

          echo "========================================"
          echo "FINAL OUTPUT VALIDATION"
          echo "========================================"

          for FILE in \
            output/all.yaml \
            output/subscription.yaml \
            output/us.yaml \
            output/world.yaml
          do
            if [ ! -s "$FILE" ]; then
              echo "❌ Missing or empty: $FILE"
              exit 1
            fi

            echo
            echo "$FILE"
            ls -lh "$FILE"
          done

          echo
          echo "Checking subscription.yaml identity..."

          cmp -s \
            output/all.yaml \
            output/subscription.yaml

          echo "✅ all.yaml == subscription.yaml"

          echo
          echo "Proxy counts:"

          python3 <<'PY'
          import yaml

          for path in (
              "output/all.yaml",
              "output/subscription.yaml",
              "output/us.yaml",
              "output/world.yaml",
          ):
              with open(path, "r", encoding="utf-8") as f:
                  data = yaml.safe_load(f)

              proxies = data.get("proxies", [])

              print(
                  f"{path}: {len(proxies)} proxies"
              )
          PY

      # ============================================================
      # SHOW OUTPUT HEADERS
      # ============================================================
      - name: Show output summary
        shell: bash
        run: |
          set -eu

          echo "========================================"
          echo "OUTPUT SUMMARY"
          echo "========================================"

          for FILE in \
            output/all.yaml \
            output/subscription.yaml \
            output/us.yaml \
            output/world.yaml
          do

            echo
            echo "----------------------------------------"
            echo "$FILE"
            echo "----------------------------------------"

            grep -n '^  - name:' "$FILE" | head -10 || true

          done

      # ============================================================
      # UPLOAD ARTIFACTS
      # ============================================================
      - name: Upload generated subscriptions
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: filtered-subscriptions
          path: |
            output/all.yaml
            output/subscription.yaml
            output/us.yaml
            output/world.yaml
            subs-check.log
          if-no-files-found: warn
          retention-days: 7
      # ============================================================
      # COMMIT AND PUSH OUTPUT
      # ============================================================
      - name: Commit and push output
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "COMMITTING OUTPUT"
          echo "========================================"

          # --------------------------------------------------------
          # Verify generated files before doing anything with Git.
          # --------------------------------------------------------

          for FILE in \
            output/all.yaml \
            output/subscription.yaml \
            output/us.yaml \
            output/world.yaml
          do
            if [ ! -s "$FILE" ]; then
              echo "❌ Missing or empty: $FILE"
              exit 1
            fi
          done

          echo "Generated files:"
          ls -lh \
            output/all.yaml \
            output/subscription.yaml \
            output/us.yaml \
            output/world.yaml

          # --------------------------------------------------------
          # Make sure subscription.yaml is still an exact copy.
          # --------------------------------------------------------

          echo
          echo "Checking subscription.yaml identity..."

          cmp -s \
            output/all.yaml \
            output/subscription.yaml

          echo "✅ subscription.yaml == all.yaml"

          # --------------------------------------------------------
          # IMPORTANT:
          #
          # Save the newly generated files outside Git's working
          # tree before synchronizing with origin/master.
          #
          # We deliberately DO NOT use:
          #
          #     git pull --rebase
          #
          # because generated YAML files can legitimately differ
          # between the local run and the remote branch.
          # --------------------------------------------------------

          TEMP_OUTPUT="$(mktemp -d)"

          cleanup_temp_output() {
            rm -rf "$TEMP_OUTPUT"
          }

          trap cleanup_temp_output EXIT

          echo
          echo "Saving generated output..."

          cp output/all.yaml \
             "$TEMP_OUTPUT/all.yaml"

          cp output/subscription.yaml \
             "$TEMP_OUTPUT/subscription.yaml"

          cp output/us.yaml \
             "$TEMP_OUTPUT/us.yaml"

          cp output/world.yaml \
             "$TEMP_OUTPUT/world.yaml"

          echo "✅ Generated output saved."

          # --------------------------------------------------------
          # Configure Git identity.
          # --------------------------------------------------------

          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"

          # --------------------------------------------------------
          # Fetch the current remote branch.
          # --------------------------------------------------------

          echo
          echo "Fetching latest origin/${GITHUB_REF_NAME}..."

          git fetch origin "${GITHUB_REF_NAME}"

          # --------------------------------------------------------
          # Reset the working tree to the CURRENT remote branch.
          #
          # This is intentional.
          #
          # The repository source/config/workflow changes already
          # pushed to GitHub must win.
          #
          # The generated output saved above will then be placed
          # on top of that latest repository state.
          # --------------------------------------------------------

          echo
          echo "Synchronizing with latest remote branch..."

          git reset --hard \
            "origin/${GITHUB_REF_NAME}"

          git clean -fd \
            -e output/

          echo "✅ Working tree synchronized with origin/${GITHUB_REF_NAME}."

          # --------------------------------------------------------
          # Restore the output generated by THIS workflow run.
          # --------------------------------------------------------

          echo
          echo "Restoring generated output..."

          mkdir -p output

          cp "$TEMP_OUTPUT/all.yaml" \
             output/all.yaml

          cp "$TEMP_OUTPUT/subscription.yaml" \
             output/subscription.yaml

          cp "$TEMP_OUTPUT/us.yaml" \
             output/us.yaml

          cp "$TEMP_OUTPUT/world.yaml" \
             output/world.yaml

          echo "✅ Generated output restored."

          # --------------------------------------------------------
          # Final safety checks.
          # --------------------------------------------------------

          echo
          echo "Final output files:"

          ls -lh \
            output/all.yaml \
            output/subscription.yaml \
            output/us.yaml \
            output/world.yaml

          echo
          echo "Final byte-for-byte check..."

          cmp -s \
            output/all.yaml \
            output/subscription.yaml

          echo "✅ all.yaml == subscription.yaml"

          # --------------------------------------------------------
          # Stage ONLY generated output.
          # --------------------------------------------------------

          git add -f \
            output/all.yaml \
            output/subscription.yaml \
            output/us.yaml \
            output/world.yaml

          # --------------------------------------------------------
          # Check whether the generated output actually differs from
          # the current remote branch.
          # --------------------------------------------------------

          echo
          echo "Checking for output changes..."

          if git diff --cached --quiet; then
            echo
            echo "ℹ️ No output changes to commit."
            exit 0
          fi

          echo
          echo "Changes to commit:"
          git diff --cached --stat

          # --------------------------------------------------------
          # Commit the generated output on top of the latest remote
          # repository state.
          # --------------------------------------------------------

          git commit \
            -m "Auto-update filtered subscriptions"

          echo
          echo "Commit created:"
          git log -1 --oneline

          # --------------------------------------------------------
          # Push.
          #
          # Because we reset to the latest origin branch before
          # committing, this should be a fast-forward push.
          # --------------------------------------------------------

          echo
          echo "Pushing to origin/${GITHUB_REF_NAME}..."

          git push \
            origin \
            "HEAD:${GITHUB_REF_NAME}"

          echo
          echo "========================================"
          echo "✅ OUTPUT PUSH COMPLETED"
          
