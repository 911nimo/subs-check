name: Update and Filter Subscriptions

permissions:
  contents: write

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  filter:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.21"

      - name: Show repository and configuration
        run: |
          echo "========================================"
          echo "REPOSITORY"
          echo "========================================"
          pwd
          git rev-parse --show-toplevel
          git rev-parse --short HEAD

          echo
          echo "========================================"
          echo "CONFIG FILE"
          echo "========================================"
          ls -lah ./config/config.yaml
          echo
          sed -n '1,240p' ./config/config.yaml

      - name: Create output directory
        run: |
          mkdir -p ./output

      - name: Run subs-check
        run: |
          echo "========================================"
          echo "RUNNING SUBS-CHECK"
          echo "========================================"

          echo "Commit:"
          git rev-parse --short HEAD

          echo
          echo "Starting..."

          go run . -f ./config/config.yaml

      - name: Inspect generated output
        if: always()
        run: |
          echo "========================================"
          echo "OUTPUT DIRECTORY"
          echo "========================================"

          if [ ! -d "./output" ]; then
            echo "❌ output directory does not exist"
            exit 1
          fi

          find ./output -maxdepth 3 -type f \
            -printf '%p (%s bytes)\n' | sort || true

      - name: Commit and push filtered output
        if: success()
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"

          git add output/

          if git diff --cached --quiet; then
            echo "No output changes to commit."
          else
            git commit -m "Auto-update filtered subscriptions [skip ci]"
            git push
          fi
