subscriptions:
  - "https://shadowmere.xyz/api/b64sub/"
  - "https://raw.githubusercontent.com/rtwo2/FastNodes/main/sub/curated.txt"
  - "https://raw.githubusercontent.com/ninjastrikers/Nexus-nodes/main/configs/all.txt"
  - "https://raw.githubusercontent.com/mahdibland/ShadowsocksAggregator/master/Eternity.yml"
  - "https://raw.githubusercontent.com/lagzian/SS-Collector/main/mix_clash.yaml"
  - "https://raw.githubusercontent.com/sevcator/5ubscrpt10n/main/protocols/ss.txt"


output: ./output/subscription.yaml
output_format: clash

check_connect: true
check_timeout: 5
remove_dead: true
keep_success: true
deduplicate: true
rename_node: true

ip_risk: true
ip_risk_threshold: 50

media_check: true
media_test:
  - netflix
  - youtube
  - openai

speed_test: true
speed_url: "https://cp.cloudflare.com/generate_204"
speed_test_timeout: 5
speed_test_workers: 10                 # Enables IP fraud score checking
ip_risk_threshold: 50         # Blocks IPs with fraud score >= 50 (0-100, lower is better)

# --- MEDIA UNLOCK TESTING (Optional) ---
media_check: true             # Tests if nodes work with streaming platforms
media_test:
  - netflix
  - youtube
  - disneyplus
  - openai

# --- SPEED TEST (Optional) ---
speed_test: true
speed_url: "https://cp.cloudflare.com/generate_204"
speed_test_timeout: 5
speed_test_workers: 10        # How many parallel speed tests to run