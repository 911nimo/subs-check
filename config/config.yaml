subscriptions:
  - "https://shadowmere.xyz/api/b64sub/"
  - "https://raw.githubusercontent.com/rtwo2/FastNodes/main/sub/curated.txt"
  - "https://raw.githubusercontent.com/ninjastrikers/Nexus-nodes/main/configs/all.txt"
  - "https://raw.githubusercontent.com/mahdibland/ShadowsocksAggregator/master/Eternity.yml"
  - "https://raw.githubusercontent.com/lagzian/SS-Collector/main/mix_clash.yaml"
  - "https://raw.githubusercontent.com/sevcator/5ubscrpt10n/main/protocols/ss.txt"

# Enable features you asked for
enable-check: true              # Test if nodes are alive
remove-dead: true               # Remove dead nodes
keep-success-proxies: true      # Keep working nodes even if upstream changes[reference:4]
deduplicate: true               # Remove duplicate nodes[reference:5]
rename-node: true               # Rename by IP location[reference:6]
media-check: true               # Enables IP fraud score filtering[reference:7]

# IP risk filter (keeps only low-risk IPs)
filter:
  - "\\|[0-4]?[0-9]%"          # Keeps nodes with IP risk < 50%

# Output for Clash/Mihomo
output-format: clash

# Speed test
speed-test: true
speed-test-url: "https://cp.cloudflare.com/generate_204"